     quirk in how UIKit's tab bar renders "preserves vector representation"
     template SVGs at that size. This `scale(1,-1)` cancels that out;
     verified against a real tab-bar screenshot, not just the isolated
     Image() test. Confirmed via the other 3 tab icons (antenna/calendar/
     message-circle), which render correctly un-flipped in the same tab
     bar — this bug is specific to this asset, not a systemic tab-bar
     quirk affecting every icon. -->
