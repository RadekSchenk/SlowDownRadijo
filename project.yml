name: SlowDownRadijo
options:
  bundleIdPrefix: cz.slowdownradijo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: "YES"

targets:
  SlowDownRadijo:
    type: application
    platform: iOS
    sources:
      - path: SlowDownRadijo
        excludes:
          - "Info.plist"
    info:
      path: SlowDownRadijo/Info.plist
      properties:
        CFBundleDisplayName: "Slow Down Radijo"
        UILaunchScreen:
          UIColorName: "LaunchBackground"
          UIImageName: "LaunchLogo"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: "Slow Down Rádijo potřebuje mikrofon, abys mohl nahrát hlasový vzkaz pro rádio."
        UIAppFonts:
          - "Manrope-Regular.ttf"
          - "Manrope-Medium.ttf"
          - "Manrope-SemiBold.ttf"
          - "Manrope-Bold.ttf"
          - "Manrope-ExtraBold.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.slowdownradijo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: SlowDownRadijoWidgetExtension
        embed: true

  # Home Screen widget — small/medium "what's on now" tile. Self-contained,
  # no App Group: it reads its own bundled copy of schedule.json and makes
  # its own lightweight Supabase call for the latest track, rather than
  # sharing state with the host app (see SlowDownRadijoWidget/README notes
  # in NowPlayingWidgetView.swift for why language/live playback aren't
  # shared here).
  SlowDownRadijoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SlowDownRadijoWidget
      - path: SlowDownRadijo/Models/Show.swift
      - path: SlowDownRadijo/Services/ScheduleStore.swift
      - path: SlowDownRadijo/Models/RemotePlayedTrack.swift
      - path: SlowDownRadijo/DesignSystem/Theme.swift
      - path: SlowDownRadijo/Resources/schedule.json
      - path: SlowDownRadijo/Resources/Assets.xcassets
    info:
      path: SlowDownRadijoWidget/Info.plist
      properties:
        CFBundleDisplayName: "Slow Down Rádijo"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.slowdownradijo.app.Widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
