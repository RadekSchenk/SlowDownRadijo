name: SlowDownRadijo
options:
  bundleIdPrefix: cz.slowdownradijo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: "YES"

targets:
  SlowDownRadijo:
    type: application
    platform: iOS
    sources:
      - path: SlowDownRadijo
        excludes:
          - "Info.plist"
    info:
      path: SlowDownRadijo/Info.plist
      properties:
        CFBundleDisplayName: "Slow Down Radijo"
        UILaunchScreen:
          UIColorName: "LaunchBackground"
          UIImageName: "LaunchLogo"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: "Slow Down Rádijo potřebuje mikrofon, abys mohl nahrát hlasový vzkaz pro rádio."
        UIAppFonts:
          - "Manrope-Regular.ttf"
          - "Manrope-Medium.ttf"
          - "Manrope-SemiBold.ttf"
          - "Manrope-Bold.ttf"
          - "Manrope-ExtraBold.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.slowdownradijo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
