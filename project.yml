name: SlowDownRadijo
options:
  bundleIdPrefix: cz.slowdownradijo
  developmentLanguage: cs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Product analytics (EU cloud), only after the listener agrees — see
  # SlowDownRadijo/Services/Analytics/Analytics.swift.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.92.0
  # Accounts and the chat (Auth, PostgREST, Realtime) — see
  # SlowDownRadijo/Services/Account/ and docs/chat-implementation.md.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # "Pokračovat s Google": Google's own sign-in sheet, its ID token goes to
  # Supabase.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Slow Down Radio s.r.o. (Apple Developer Program).
    DEVELOPMENT_TEAM: 9W8BX34TJH
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: "YES"

targets:
  SlowDownRadijo:
    type: application
    platform: iOS
    sources:
      - path: SlowDownRadijo
        excludes:
          - "Info.plist"
    # CarPlay Audio, granted to the team by Apple and enabled on the App ID.
    entitlements:
      path: SlowDownRadijo/SlowDownRadijo.entitlements
      properties:
        com.apple.developer.carplay-audio: true
        # "Pokračovat s Apple" (Profil, chat). The capability must be on for
        # the App ID cz.slowdownradijo.app in the Apple Developer account.
        com.apple.developer.applesignin:
          - Default
        # DJ invite links https://slowdownradijo.cz/dj/<code> (chat). Needs the
        # Associated Domains capability on the App ID and
        # /.well-known/apple-app-site-association on the web (backend/README.md).
        com.apple.developer.associated-domains:
          - applinks:slowdownradijo.cz
    info:
      path: SlowDownRadijo/Info.plist
      properties:
        CFBundleDisplayName: "Slow Down Rádijo"
        # From the build settings, so upload.sh's build number gets in
        # (XcodeGen otherwise writes a fixed 1.0 / 1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - cs
          - en
        # HTTPS only (exempt) — answers App Store Connect's export question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: "LaunchBackground"
          UIImageName: "LaunchLogo"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad (1.4): every way round, which also lets the app share the
        # screen (Split View, Stage Manager). Phones stay portrait.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # Sign-in: Google's iOS OAuth client (from the build settings below)
        # and the app's own scheme, where the e-mail link and Google's sheet
        # return (slowdownradijo://auth).
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: cz.slowdownradijo.app
            CFBundleURLSchemes:
              - slowdownradijo
          - CFBundleURLName: com.google.signin
            CFBundleURLSchemes:
              - "$(GOOGLE_IOS_URL_SCHEME)"
        # CarPlay Audio: a second scene for the car's screen; the phone's
        # window stays SwiftUI's own (WindowGroup).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
        # Dark only: the app has no light mode (also keeps system UI such as
        # alerts, the keyboard and Safari sheets dark).
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Translated in Resources/{cs,en}.lproj/InfoPlist.strings.
        NSMicrophoneUsageDescription: "Slow Down Rádijo potřebuje mikrofon, abys mohl nahrát hlasový vzkaz pro rádio."
        # Budík s rádiem (AlarmKit, iOS 26+); translated in InfoPlist.strings.
        NSAlarmKitUsageDescription: "Ráno tě vzbudí živé vysílání. Budík zazvoní i v tichém režimu."
        # AlarmKit shows the snooze countdown as a Live Activity.
        NSSupportsLiveActivities: true
        UIAppFonts:
          - "Manrope-Light.ttf"
          - "Manrope-Regular.ttf"
          - "Manrope-Medium.ttf"
          - "Manrope-SemiBold.ttf"
          - "Manrope-Bold.ttf"
          - "Manrope-ExtraBold.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.slowdownradijo.app
        # iPhone only. Set here, not just in the project's base settings:
        # XcodeGen's preset for an iOS app target says iPhone + iPad, which
        # overrode the base, and App Store Connect then refused the upload
        # (an iPad app must support every orientation).
        TARGETED_DEVICE_FAMILY: "1,2"
        # The winter icon for the season's release (1.4, docs/winter.md);
        # the first release after Epiphany sets this back to AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconWinter
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "5"
        # Google Cloud → APIs & Services → Credentials → the iOS OAuth client:
        # its client id, and the "iOS URL scheme" (the id reversed). Until
        # they are filled in, "Pokračovat s Google" says it's unavailable.
        GOOGLE_IOS_CLIENT_ID: "234753697587-svd5687t2ruucnc4oh5a80i654bni44h.apps.googleusercontent.com"
        GOOGLE_IOS_URL_SCHEME: "com.googleusercontent.apps.234753697587-svd5687t2ruucnc4oh5a80i654bni44h"
    dependencies:
      - target: SlowDownRadijoWidgetExtension
        embed: true
      - package: PostHog
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn

  # Drives the app in the simulator (tab bar); run by
  # .github/workflows/ui-tests.yml, or Cmd+U in Xcode.
  SlowDownRadijoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SlowDownRadijoUITests
    dependencies:
      - target: SlowDownRadijo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.slowdownradijo.app.UITests
        TEST_TARGET_NAME: SlowDownRadijo
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Home Screen widget — small/medium "what's on now" tile. Self-contained,
  # no App Group: it reads its own bundled copy of schedule.json and makes
  # its own lightweight Supabase call for the latest track, rather than
  # sharing state with the host app (see SlowDownRadijoWidget/README notes
  # in NowPlayingWidgetView.swift for why language/live playback aren't
  # shared here).
  SlowDownRadijoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SlowDownRadijoWidget
      - path: SlowDownRadijo/Models/Show.swift
      - path: SlowDownRadijo/Services/ScheduleStore.swift
      - path: SlowDownRadijo/Services/WebScheduleService.swift
      - path: SlowDownRadijo/Models/RemotePlayedTrack.swift
      - path: SlowDownRadijo/Models/TrackTrust.swift
      - path: SlowDownRadijo/Services/RadioAlarm/RadioAlarmMetadata.swift
      - path: SlowDownRadijo/DesignSystem/Theme.swift
      - path: SlowDownRadijo/Resources/schedule.json
      - path: SlowDownRadijo/Resources/Assets.xcassets
      - path: SlowDownRadijo/Resources/Fonts
    info:
      path: SlowDownRadijoWidget/Info.plist
      properties:
        CFBundleDisplayName: "Slow Down Rádijo"
        # Must match the app's (see above).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - "Manrope-Regular.ttf"
          - "Manrope-Medium.ttf"
          - "Manrope-SemiBold.ttf"
          - "Manrope-Bold.ttf"
          - "Manrope-ExtraBold.ttf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.slowdownradijo.app.Widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "5"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  SlowDownRadijo:
    build:
      targets:
        SlowDownRadijo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlowDownRadijoUITests
    archive:
      config: Release
