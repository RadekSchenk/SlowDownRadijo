# The Android app on an emulator: installs the debug build, walks through
# it with the live stream playing (tools/android/emulator_walkthrough.sh)
# and uploads the screen recording and screenshots as the
# "android-walkthrough" artifact.
#
# Run it from the Actions tab, or push a commit whose message contains
# [emulator].
name: Android emulator

on:
  workflow_dispatch:
  push:
    branches: [claude/android]

jobs:
  walkthrough:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Build
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: tools/android/emulator_walkthrough.sh android/app/build/outputs/apk/debug/app-debug.apk walkthrough

      - name: Contact sheet and errors
        if: always()
        run: |
          echo "===== ERRORS"
          cat walkthrough/errors.log || true
          echo "===== END ERRORS"
          python3 -m pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          shots = sorted(glob.glob("walkthrough/*.png"))
          thumbs = [Image.open(p).convert("RGB") for p in shots]
          thumbs = [t.resize((300, t.height * 300 // t.width)) for t in thumbs]
          cols = 7
          rows = (len(thumbs) + cols - 1) // cols
          h = max(t.height for t in thumbs)
          sheet = Image.new("RGB", (cols * 300, rows * h), (30, 30, 30))
          for i, t in enumerate(thumbs):
              sheet.paste(t, ((i % cols) * 300, (i // cols) * h))
          sheet.save("walkthrough/sheet.jpg", quality=70)
          PY
          echo "===== IMAGE contact sheet"
          base64 -w 1000 walkthrough/sheet.jpg
          echo "===== END IMAGE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-walkthrough
          path: walkthrough/
