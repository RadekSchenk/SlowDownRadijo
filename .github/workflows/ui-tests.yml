# Builds the app and runs the UI tests (SlowDownRadijoUITests) on an iOS
# simulator. No signing: simulator builds don't need it.
name: UI tests

on:
  push:
    branches: [claude/adoring-tesla-bj752w]
    paths:
      - "SlowDownRadijo/**"
      - "SlowDownRadijoUITests/**"
      - "SlowDownRadijoWidget/**"
      - "project.yml"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for runtime in sorted(data, key=version, reverse=True):
              if "iOS" not in runtime:
                  continue
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"], file=sys.stderr)
                  print(runtime, phones[0]["name"], file=sys.stderr)
                  print(phones[0]["udid"])
                  break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SlowDownRadijo.xcodeproj \
            -scheme SlowDownRadijo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:SlowDownRadijoUITests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*RootTabView|Test Case|Executed|\*\* TEST|failed|passed" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls -la screenshots | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            screenshots
            xcodebuild.log
