# The showcase video: ShowcaseTests walks through the app on a simulator
# while the screen and the live stream are recorded; .github/showcase/
# compose.py then adds captions, an intro and an outro. The video is
# uploaded as the "showcase" artifact; a contact sheet of frames is printed
# into the log (base64 JPEG) for a quick look.
#
# Run it from the Actions tab, or push a commit whose message contains
# [showcase].
name: Showcase video

on:
  workflow_dispatch:
  push:
    branches: [claude/adoring-tesla-bj752w]

jobs:
  showcase:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[showcase]') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen ffmpeg
          python3 -m pip install --break-system-packages --quiet pillow
          xcodegen generate

      - name: Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for runtime in sorted(data, key=version, reverse=True):
              if "iOS" not in runtime:
                  continue
              phones = [d for d in data[runtime] if d["name"] == "iPhone 17 Pro"] or [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(runtime, phones[0]["name"], file=sys.stderr)
                  print(phones[0]["udid"])
                  break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # A tidy status bar, with the time in Prague (the runner is UTC).
          TIME=$(TZ=Europe/Prague date +%-H:%M)
          xcrun simctl status_bar "$UDID" override --time "$TIME" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SlowDownRadijo.xcodeproj \
            -scheme SlowDownRadijo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Record
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p work
          # The station's live sound, for under the video.
          python3 -c 'import time; print(time.time())' > work/audio_start
          ffmpeg -loglevel error -y -i https://icecast5.play.cz/slowdown.aac -t 240 -c copy work/radio.aac &
          AUDIO=$!
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force work/raw.mov 2> work/record.log &
          RECORD=$!
          for i in $(seq 1 100); do
            grep -q "Recording started" work/record.log 2>/dev/null && break
            sleep 0.1
          done
          python3 -c 'import time; print(time.time())' > work/rec_start
          xcodebuild test-without-building \
            -project SlowDownRadijo.xcodeproj \
            -scheme SlowDownRadijo \
            -destination "id=$UDID" \
            -derivedDataPath DerivedData \
            -only-testing:SlowDownRadijoUITests/ShowcaseTests \
            CODE_SIGNING_ALLOWED=NO > work/test.log 2>&1 || true
          kill -INT $RECORD; wait $RECORD || true
          kill -INT $AUDIO; wait $AUDIO || true
          grep -E "SHOWCASE_MARK|error:|Test Case" work/test.log || true
          ls -la work

      - name: Compose
        run: python3 .github/showcase/compose.py work

      - name: Contact sheet
        run: |
          ffmpeg -loglevel error -y -i work/showcase.mp4 -vf "fps=1/3,scale=200:-1,tile=8x4" -frames:v 1 -q:v 6 work/sheet.jpg
          echo "===== IMAGE contact sheet"
          base64 -i work/sheet.jpg | fold -w 1000
          echo "===== END IMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: |
            work/showcase.mp4
            work/sheet.jpg
