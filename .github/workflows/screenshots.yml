# Screenshots of the app at a chosen text size and language (run by hand
# from the Actions tab). Each one is printed into the log as a small JPEG
# (base64) and uploaded full size as an artifact.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      text_sizes:
        description: "UIContentSizeCategory values, space separated"
        default: "UICTContentSizeCategoryL UICTContentSizeCategoryXXXL UICTContentSizeCategoryAccessibilityL"
      language:
        description: "cs or en"
        default: "cs"
      device:
        description: "Simulator name prefix"
        default: "iPhone 17 Pro"

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | DEVICE="${{ inputs.device }}" python3 -c '
          import json, os, sys, re
          data = json.load(sys.stdin)["devices"]
          want = os.environ["DEVICE"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for runtime in sorted(data, key=version, reverse=True):
              if "iOS" not in runtime:
                  continue
              phones = [d for d in data[runtime] if d["name"] == want] or [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(runtime, phones[0]["name"], file=sys.stderr)
                  print(phones[0]["udid"])
                  break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SlowDownRadijo.xcodeproj \
            -scheme SlowDownRadijo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Capture
        run: |
          mkdir -p shots
          for size in ${{ inputs.text_sizes }}; do
            rm -rf "Result-$size.xcresult"
            SCREENSHOT_TEXT_SIZE="$size" SCREENSHOT_LANGUAGE="${{ inputs.language }}" \
            TEST_RUNNER_SCREENSHOT_TEXT_SIZE="$size" TEST_RUNNER_SCREENSHOT_LANGUAGE="${{ inputs.language }}" \
            xcodebuild test-without-building \
              -project SlowDownRadijo.xcodeproj \
              -scheme SlowDownRadijo \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath DerivedData \
              -only-testing:SlowDownRadijoUITests/ScreenshotTests \
              -resultBundlePath "Result-$size.xcresult" \
              CODE_SIGNING_ALLOWED=NO | tail -3 || true
            xcrun xcresulttool export attachments --path "Result-$size.xcresult" --output-path "shots/$size" || true
          done

      - name: Print screenshots
        run: |
          python3 - <<'PY'
          import json, os, subprocess, glob
          for manifest in sorted(glob.glob("shots/*/manifest.json")):
              folder = os.path.dirname(manifest)
              for test in json.load(open(manifest)):
                  for att in test.get("attachments", []):
                      name = att.get("suggestedHumanReadableName", "")
                      path = os.path.join(folder, att["exportedFileName"])
                      if not path.endswith(".png"):
                          continue
                      jpg = path[:-4] + ".jpg"
                      subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "45", "-Z", "700", path, "--out", jpg], capture_output=True)
                      data = subprocess.run(["base64", "-i", jpg], capture_output=True, text=True).stdout.replace("\n", "")
                      print(f"===== IMAGE {name}")
                      print(data)
                      print("===== END IMAGE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
